<title>Cubo Solver</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>/* Herramienta de dos paneles: scramble a la izquierda, editor/solver a la derecha; una columna en el móvil. */
:root {
  --fondo: #eef0f4;
  --superficie: #ffffff;
  --tinta: #161a22;
  --tenue: #5b6273;
  --linea: #d7dbe4;
  --acento: #2f55d4;
  --acento-tinta: #ffffff;
  --acento-suave: #e3e9fb;
  --error: #b42318;
  --error-suave: #fdecea;
  --ok: #1f7a43;
  --ok-suave: #e5f4ea;
  --lienzo: #dde1ea;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-texto: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #101319; --superficie: #191d25; --tinta: #e7eaf1; --tenue: #9aa2b4; --linea: #2c3240;
    --acento: #7d97ff; --acento-tinta: #0e1220; --acento-suave: #232b45; --error: #ff8a7a; --error-suave: #3a1f1d;
    --ok: #6fd39a; --ok-suave: #173326; --lienzo: #232834; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #101319; --superficie: #191d25; --tinta: #e7eaf1; --tenue: #9aa2b4; --linea: #2c3240;
  --acento: #7d97ff; --acento-tinta: #0e1220; --acento-suave: #232b45; --error: #ff8a7a; --error-suave: #3a1f1d;
  --ok: #6fd39a; --ok-suave: #173326; --lienzo: #232834; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--fondo); color: var(--tinta); }
body { font-family: var(--f-texto); font-size: 15px; line-height: 1.5; }
.app {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  display: flex; flex-direction: column; gap: 18px;
}
.cabecera { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.marca h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; letter-spacing: -0.02em; margin: 0; line-height: 1.05; }
.marca .sub { margin: 4px 0 0; color: var(--tenue); font-size: 0.92rem; }
.selector { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 600 0.88rem var(--f-texto); padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--linea); background: var(--superficie); color: var(--tinta); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip .punto { width: 6px; height: 6px; border-radius: 50%; background: var(--tenue); opacity: 0.45; }
.chip.con-solver .punto { background: var(--ok); opacity: 1; }
.chip[aria-pressed="true"] { background: var(--tinta); color: var(--fondo); border-color: var(--tinta); }
.chip:focus-visible, .boton:focus-visible, .boton-texto:focus-visible, .color:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

.paneles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; align-items: start; }
.panel { background: var(--superficie); border: 1px solid var(--linea); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
.etiqueta { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--tenue); font-weight: 600; }

.scramble-caja { background: var(--fondo); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.scramble { white-space: pre-line; font-family: var(--f-mono); font-size: 1.02rem; line-height: 1.65; margin: 0; word-spacing: 0.25em; overflow-wrap: anywhere; min-height: 1.65em; }
.scramble.largo { font-size: 0.86rem; }
.scramble-meta { display: flex; justify-content: space-between; align-items: center; color: var(--tenue); font-size: 0.8rem; font-variant-numeric: tabular-nums; }

.vista { background: var(--lienzo); border-radius: 10px; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 180px; }
.vista svg { width: 100%; max-width: 520px; height: auto; max-height: 340px; display: block; }
.vista.editable svg .pegatina { cursor: pointer; }
.vista.editable svg .pegatina:hover { filter: brightness(1.12); }

.acciones { display: flex; flex-wrap: wrap; gap: 8px; }
.boton {
  font: 600 0.9rem var(--f-texto); padding: 9px 14px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--linea); background: var(--superficie); color: var(--tinta);
}
.boton:hover:not(:disabled) { border-color: var(--tenue); }
.boton.principal { background: var(--acento); color: var(--acento-tinta); border-color: var(--acento); }
.boton.principal:hover:not(:disabled) { filter: brightness(1.08); }
.boton:disabled { opacity: 0.45; cursor: not-allowed; }
.boton.icono { min-width: 42px; padding: 7px 10px; font-size: 1.1rem; line-height: 1; font-family: var(--f-texto); }
.boton-texto { font: 600 0.8rem var(--f-texto); background: none; border: 0; color: var(--acento); cursor: pointer; padding: 2px 4px; }

.paleta { display: flex; flex-wrap: wrap; gap: 8px; }
.color {
  width: 38px; height: 38px; border-radius: 9px; cursor: pointer; border: 2px solid var(--linea);
  box-shadow: inset 0 0 0 2px var(--superficie);
}
.color[aria-checked="true"] { border-color: var(--tinta); transform: translateY(-2px); }
.herramienta {
  height: 38px; padding: 0 12px; border-radius: 9px; cursor: pointer; border: 2px solid var(--linea);
  background: var(--superficie); color: var(--tinta); font: 600 0.86rem var(--f-texto);
  display: inline-flex; align-items: center; gap: 6px;
}
.herramienta span { font-size: 1.05rem; line-height: 1; }
.herramienta[aria-checked="true"] { border-color: var(--acento); background: var(--acento-suave); transform: translateY(-2px); }
.herramienta:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.boton.pequeno { padding: 6px 10px; font-size: 0.84rem; }
.acciones-editor { margin-top: -6px; }

.editor { display: flex; flex-direction: column; gap: 14px; }
.editor.desactivado { opacity: 0.4; pointer-events: none; user-select: none; }
.proximamente { border: 1px dashed var(--linea); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; color: var(--tenue); }
.proximamente strong { color: var(--tinta); font-family: var(--f-display); font-size: 1rem; }

.mensajes { display: flex; flex-direction: column; gap: 6px; }
.mensaje { border-radius: 9px; padding: 9px 12px; font-size: 0.9rem; }
.mensaje.error { background: var(--error-suave); color: var(--error); }
.mensaje.ok { background: var(--ok-suave); color: var(--ok); }
.mensaje.info { background: var(--acento-suave); color: var(--tinta); }

.solucion { border-top: 1px solid var(--linea); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.solucion-cab { display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; color: var(--tenue); font-variant-numeric: tabular-nums; }
.movs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.movs li {
  font-family: var(--f-mono); font-size: 0.95rem; padding: 3px 8px; border-radius: 6px;
  background: var(--fondo); cursor: pointer; min-width: 2.3em; text-align: center;
}
.movs li.hecho { color: var(--tenue); }
.movs li.actual { background: var(--acento); color: var(--acento-tinta); }
.reproductor { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.paso { margin-left: auto; font-size: 0.85rem; color: var(--tenue); font-variant-numeric: tabular-nums; }
.desc { margin: -6px 0 0; color: var(--tenue); font-size: 0.88rem; }
.desc:empty { display: none; }
.aviso { margin: 0; font-size: 0.85rem; color: var(--tenue); font-variant-numeric: tabular-nums; }
.aviso.cargando::before {
  content: ""; display: inline-block; width: 0.8em; height: 0.8em; margin-right: 6px; vertical-align: -0.1em;
  border: 2px solid var(--linea); border-top-color: var(--acento); border-radius: 50%; animation: girar 0.8s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }
.pie { color: var(--tenue); font-size: 0.8rem; display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="app">
  <header class="cabecera">
    <div class="marca">
      <h1>Cubo Solver</h1>
      <p class="sub">Scrambles WCA, validador y solucionador</p>
    </div>
    <nav class="selector" id="selector" aria-label="Puzzle"></nav>
  </header>

  <main class="paneles">
    <section class="panel" aria-labelledby="t-scramble">
      <div class="panel-cab">
        <h2 id="t-scramble">Scramble</h2>
        <span class="etiqueta" id="tipo-scramble"></span>
      </div>
      <div class="scramble-caja">
        <p class="scramble" id="scramble" aria-live="polite"></p>
        <div class="scramble-meta">
          <span id="longitud"></span>
          <button type="button" class="boton-texto" id="copiar">Copiar</button>
        </div>
      </div>
      <div class="vista" id="vista-scramble"></div>
      <div class="acciones">
        <button type="button" class="boton principal" id="nuevo">Nuevo scramble</button>
      </div>
      <p class="aviso" id="aviso-tablas" hidden></p>
    </section>

    <section class="panel" aria-labelledby="t-resolver" id="panel-resolver">
      <div class="panel-cab">
        <h2 id="t-resolver">Resolver</h2>
        
      </div>
      <p class="desc" id="desc-solver"></p>
      <div class="proximamente" id="proximamente" hidden>
        <strong>Próximamente</strong>
        <span>El editor y el solucionador de este puzzle llegarán en una próxima versión.</span>
      </div>
      <div class="editor" id="editor">
        <div class="paleta" id="paleta" role="radiogroup" aria-label="Color para pintar"></div>
        <div class="vista editable" id="vista-editor"></div>
        <div class="acciones acciones-editor" id="acciones-editor" hidden></div>
        <div class="acciones">
          <button type="button" class="boton" id="resetear">Resetear</button>
          <button type="button" class="boton" id="cargar">Cargar scramble actual</button>
          <button type="button" class="boton principal" id="resolver">Resolver</button>
        </div>
        <div class="mensajes" id="mensajes" aria-live="polite"></div>
        <div class="solucion" id="solucion" hidden>
          <div class="solucion-cab">
            <span id="sol-resumen"></span>
            <button type="button" class="boton-texto" id="copiar-sol">Copiar</button>
          </div>
          <ol class="movs" id="movs"></ol>
          <div class="reproductor">
            <button type="button" class="boton icono" id="r-inicio" aria-label="Ir al inicio">⇤</button>
            <button type="button" class="boton icono" id="r-atras" aria-label="Paso anterior">‹</button>
            <button type="button" class="boton icono principal" id="r-play" aria-label="Reproducir">▶</button>
            <button type="button" class="boton icono" id="r-adelante" aria-label="Paso siguiente">›</button>
            <button type="button" class="boton icono" id="r-fin" aria-label="Ir al final">⇥</button>
            <span class="paso" id="paso"></span>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="pie">
    <span>Notación WCA. Los scrambles de 2x2, 3x3, Pyraminx, Skewb y Square-1 son de estado aleatorio.</span>
    <span id="modo-calculo"></span>
  </footer>
</div>
