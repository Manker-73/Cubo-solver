# Ejecuta npm run test:rapido en cada push a main y en cada pull request.
# A mano (Actions → "Tests (rápido)" → Run workflow) se puede elegir el nivel: rapido, humo o
# completo (npm test, la suite completa: más de una hora).
# Es independiente de pages.yml: la publicación en GitHub Pages no espera a los tests.
# Resultado: pestaña "Actions" del repositorio → "Tests (rápido)", o el icono ✔/✘ junto a cada commit.
name: Tests (rápido)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      nivel:
        description: 'Nivel: rapido, humo o completo (npm test)'
        default: rapido
        type: choice
        options: [rapido, humo, completo]

permissions:
  contents: read

# Si llega otro push a la misma rama, se cancela la ejecución anterior (solo cuenta la última).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.nivel == 'completo' && 300 || 40 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Núcleos disponibles
        run: nproc

      - name: Tests (nivel ${{ inputs.nivel || 'rapido' }})
        run: node scripts/tests.mjs ${{ inputs.nivel || 'rapido' }}
