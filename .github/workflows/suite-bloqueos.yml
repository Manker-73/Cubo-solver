# Suite completa de tests/bloqueos.test.mjs (npm test solo de ese fichero: 500 casos por configuración
# de la noche 13 y 200 de las configuraciones que no caben en el BFS de geometrías).
# Se lanza a mano (Actions → "Suite completa de bloqueos" → Run workflow) o con un push a una rama
# suite/… (para poder lanzarla sin permisos de la API: git push origin HEAD:suite/bloqueos).
name: Suite completa de bloqueos

on:
  workflow_dispatch:
  push:
    branches: ['suite/**']

permissions:
  contents: read

concurrency:
  group: suite-bloqueos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bloqueos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Núcleos disponibles
        run: nproc
      - name: Tipos
        run: npm run tipos
      - name: tests/bloqueos.test.mjs (completo)
        run: CASOS=1000 NIVEL=completo node --test --test-concurrency=1 --test-reporter=spec tests/bloqueos.test.mjs
      - name: Resultados
        if: always()
        run: cat tests/resultados/bloqueos.json || true
